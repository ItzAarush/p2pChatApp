<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nebula Chat — P2P</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<style>
:root{
  --bg:#0b0b14; --bg2:#12121f; --card:rgba(255,255,255,.06); --card-b:rgba(255,255,255,.12);
  --txt:#f2f2f7; --sub:#9a9ab0; --accent:#7c5cff; --accent2:#00e0c6; --danger:#ff5c7c;
  --bubble-me:linear-gradient(135deg,#7c5cff,#5a3ff0); --bubble-them:rgba(255,255,255,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Segoe UI',ui-sans-serif,system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--txt); overflow:hidden;
  padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
}
.orb{position:fixed; border-radius:50%; filter:blur(70px); opacity:.35; z-index:0; animation:float 14s ease-in-out infinite;}
.orb1{width:340px;height:340px; background:var(--accent); top:-100px; left:-80px;}
.orb2{width:300px;height:300px; background:var(--accent2); bottom:-100px; right:-60px; animation-delay:-6s;}
@keyframes float{0%,100%{transform:translate(0,0);}50%{transform:translate(30px,-40px);}}
.screen{position:relative; z-index:1; height:100vh; height:100dvh; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:24px; text-align:center; animation:fadeIn .5s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
.hidden{display:none !important;}
.logo{font-size:34px; font-weight:800; letter-spacing:-1px; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:6px;}
.tagline{color:var(--sub); font-size:13px; margin-bottom:32px;}
.card{background:var(--card); border:1px solid var(--card-b); backdrop-filter:blur(20px); border-radius:24px; padding:28px; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,.4);}
input{
  width:100%; padding:14px 16px; border-radius:14px; border:1px solid var(--card-b); background:rgba(255,255,255,.05);
  color:var(--txt); font-size:16px; outline:none; transition:.2s; margin-bottom:12px; text-align:center; letter-spacing:.5px;
}
input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,92,255,.25);}
button{
  cursor:pointer; border:none; border-radius:14px; font-weight:600; font-size:15px; padding:14px 18px;
  transition:transform .15s ease, box-shadow .15s ease; width:100%; margin-top:4px;
}
button:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--accent),#5a3ff0); color:#fff; box-shadow:0 8px 24px rgba(124,92,255,.4);}
.btn-primary:hover{box-shadow:0 10px 30px rgba(124,92,255,.55);}
.btn-ghost{background:transparent; color:var(--sub); border:1px solid var(--card-b); margin-top:10px;}
.btn-ghost:hover{color:var(--txt); border-color:var(--accent);}
.row{display:flex; gap:10px;}
.code-display{font-size:38px; font-weight:800; letter-spacing:6px; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; margin:18px 0 6px;}
.pulse-dot{width:9px;height:9px;border-radius:50%; background:var(--accent2); display:inline-block; margin-right:6px; animation:pulse 1.2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,224,198,.6);}70%{box-shadow:0 0 0 10px rgba(0,224,198,0);}100%{box-shadow:0 0 0 0 rgba(0,224,198,0);}}
.status-pill{display:inline-flex; align-items:center; font-size:12.5px; color:var(--sub); background:rgba(255,255,255,.05); border:1px solid var(--card-b); padding:6px 14px; border-radius:100px; margin-top:16px;}

/* CHAT */
#screen-chat{padding:0; height:100vh; height:100dvh;}
.chat-wrap{display:flex; flex-direction:column; height:100%; width:100%; max-width:640px; margin:0 auto; position:relative; z-index:1;}
.chat-header{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; padding-top:calc(14px + env(safe-area-inset-top,0)); background:rgba(255,255,255,.04); border-bottom:1px solid var(--card-b); backdrop-filter:blur(20px);}
.peer-info{display:flex; align-items:center; gap:10px;}
.avatar{width:38px;height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2));}
.peer-name{font-weight:700; font-size:15px;}
.peer-sub{font-size:11.5px; color:var(--sub); display:flex; align-items:center;}
.header-actions button{width:auto; padding:9px; margin:0; background:rgba(255,255,255,.06); border:1px solid var(--card-b);}
.messages{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth;}
.bubble-row{display:flex; animation:pop .35s cubic-bezier(.2,.9,.3,1.3);}
@keyframes pop{from{opacity:0; transform:translateY(14px) scale(.92);} to{opacity:1; transform:translateY(0) scale(1);}}
.bubble-row.me{justify-content:flex-end;}
.bubble{max-width:74%; padding:11px 15px; border-radius:20px; font-size:14.5px; line-height:1.4; word-wrap:break-word;}
.bubble-row.me .bubble{background:var(--bubble-me); border-bottom-right-radius:6px; color:#fff;}
.bubble-row.them .bubble{background:var(--bubble-them); border:1px solid var(--card-b); border-bottom-left-radius:6px;}
.bubble img,.bubble video{max-width:100%; border-radius:12px; margin-top:4px; display:block;}
.bubble-time{font-size:10px; opacity:.6; margin-top:4px; text-align:right;}
.typing-row .bubble{display:flex; gap:4px; align-items:center; padding:14px 16px;}
.typing-dot{width:6px;height:6px;border-radius:50%; background:var(--sub); animation:bounce 1.2s infinite;}
.typing-dot:nth-child(2){animation-delay:.15s;} .typing-dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:.4;} 30%{transform:translateY(-5px); opacity:1;}}
.composer{display:flex; align-items:flex-end; gap:8px; padding:12px 14px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0)); background:rgba(255,255,255,.04); border-top:1px solid var(--card-b); backdrop-filter:blur(20px);}
.icon-btn{width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.06); border:1px solid var(--card-b); color:var(--txt); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; margin:0;}
#msgInput{flex:1; margin:0; border-radius:22px; resize:none; max-height:100px;}
#sendBtn{width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); flex-shrink:0; font-size:18px; margin:0; display:flex; align-items:center; justify-content:center; color:#fff;}
#sendBtn:disabled{opacity:.4;}
.video-pip{position:fixed; z-index:20; bottom:100px; right:16px; width:130px; border-radius:16px; overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,.5); border:2px solid var(--accent);}
.video-pip video{width:100%; display:block; background:#000;}
.video-full{position:fixed; inset:0; z-index:30; background:#000; display:flex; align-items:center; justify-content:center;}
.video-full video{width:100%; height:100%; object-fit:cover;}
.video-controls{position:fixed; bottom:calc(30px + env(safe-area-inset-bottom,0)); left:0; right:0; display:flex; justify-content:center; gap:16px; z-index:31;}
.video-controls button{width:54px;height:54px;border-radius:50%; margin:0;}
::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--card-b); border-radius:10px;}
.toast{position:fixed; top:calc(20px + env(safe-area-inset-top,0)); left:50%; transform:translateX(-50%); background:rgba(20,20,30,.9); border:1px solid var(--card-b); backdrop-filter:blur(10px); padding:10px 18px; border-radius:100px; font-size:13px; z-index:50; animation:fadeIn .3s ease;}
</style>
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div>

<div id="screen-name" class="screen">
  <div class="logo">✦ Nebula Chat</div>
  <div class="tagline">Direct device-to-device. Nothing stored, ever.</div>
  <div class="card">
    <input id="nameInput" placeholder="Your name" maxlength="18" autocomplete="off">
    <button class="btn-primary" onclick="goPick()">Continue</button>
  </div>
</div>

<div id="screen-pick" class="screen hidden">
  <div class="card">
    <div style="font-weight:700; font-size:18px; margin-bottom:18px;">Start a conversation</div>
    <button class="btn-primary" onclick="createRoom()">Create a room</button>
    <button class="btn-ghost" onclick="showJoin()">Join with a code</button>
  </div>
</div>

<div id="screen-join" class="screen hidden">
  <div class="card">
    <div style="font-weight:700; font-size:18px; margin-bottom:18px;">Enter room code</div>
    <input id="codeInput" placeholder="ABC123" maxlength="6" style="text-transform:uppercase; font-size:22px; letter-spacing:4px;">
    <button class="btn-primary" onclick="joinRoom()">Connect</button>
    <button class="btn-ghost" onclick="show('screen-pick')">Back</button>
  </div>
</div>

<div id="screen-code" class="screen hidden">
  <div class="card">
    <div style="color:var(--sub); font-size:13px;">Share this code with them</div>
    <div class="code-display" id="roomCodeDisplay">------</div>
    <button class="btn-primary" onclick="copyLink()">Copy invite link</button>
    <div class="status-pill"><span class="pulse-dot"></span><span id="waitStatus">Waiting for them to join…</span></div>
  </div>
</div>

<div id="screen-chat" class="screen hidden">
  <div class="chat-wrap">
    <div class="chat-header">
      <div class="peer-info">
        <div class="avatar" id="peerAvatar">?</div>
        <div>
          <div class="peer-name" id="peerNameLabel">Connecting…</div>
          <div class="peer-sub"><span class="pulse-dot" id="onlineDot"></span><span id="peerStatus">connecting</span></div>
        </div>
      </div>
      <div class="header-actions"><button class="icon-btn" onclick="startVideoCall()" title="Video call">🎥</button></div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input type="file" id="fileInput" accept="image/*,video/*" class="hidden" onchange="handleFile(event)">
      <button class="icon-btn" onclick="fileInput.click()">📎</button>
      <textarea id="msgInput" rows="1" placeholder="Message" oninput="onTyping()" onkeydown="onKeyDown(event)"></textarea>
      <button id="sendBtn" onclick="sendText()">➤</button>
    </div>
  </div>
</div>

<div id="videoPip" class="video-pip hidden"><video id="remoteVideo" autoplay playsinline></video></div>
<div id="videoFull" class="video-full hidden">
  <video id="localVideoFull" autoplay playsinline muted></video>
  <div class="video-controls">
    <button class="icon-btn" style="background:var(--danger);" onclick="endVideoCall()">✕</button>
    <button class="icon-btn" onclick="toggleMic()">🎤</button>
  </div>
</div>

<script>
let myName='', peer=null, conn=null, roomCode='', isHost=false;
let localStream=null, currentCall=null, typingTimeout=null;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden');}
function toast(t){const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2500);}
function genCode(){return Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');}
function initials(n){return (n||'?').trim().slice(0,2).toUpperCase();}

function goPick(){
  myName=document.getElementById('nameInput').value.trim();
  if(!myName){toast('Enter your name first'); return;}
  const urlRoom=new URLSearchParams(location.search).get('room');
  if(urlRoom){document.getElementById('codeInput').value=urlRoom; show('screen-join');}
  else show('screen-pick');
}
function showJoin(){show('screen-join');}

function setupPeer(id, onOpen){
  peer=new Peer(id);
  peer.on('open', onOpen);
  peer.on('error', e=>{console.error(e); toast('Connection error — try again');});
  peer.on('connection', c=>{conn=c; bindConn(); });
  peer.on('call', call=>{
    if(!localStream){
      navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(s=>{localStream=s; document.getElementById('localVideoFull').srcObject=s; call.answer(s); bindCall(call);});
    } else { call.answer(localStream); bindCall(call); }
  });
}

function createRoom(){
  roomCode=genCode(); isHost=true;
  document.getElementById('roomCodeDisplay').textContent=roomCode;
  show('screen-code');
  setupPeer('nebula-'+roomCode, ()=>{});
}
function copyLink(){
  const link=location.origin+location.pathname+'?room='+roomCode;
  navigator.clipboard.writeText(link).then(()=>toast('Link copied!'));
}
function joinRoom(){
  const code=document.getElementById('codeInput').value.trim().toUpperCase();
  if(code.length<4){toast('Enter a valid code'); return;}
  roomCode=code; isHost=false;
  setupPeer(null, ()=>{
    conn=peer.connect('nebula-'+roomCode, {reliable:true});
    conn.on('open', ()=>{bindConn();});
    conn.on('error', ()=>toast('Could not connect — check the code'));
  });
  show('screen-join'); document.getElementById('codeInput').disabled=true;
}

function bindConn(){
  conn.on('open', ()=>{
    show('screen-chat');
    document.getElementById('peerStatus').textContent='online';
    conn.send({type:'hello', name:myName});
  });
  conn.on('data', handleData);
  conn.on('close', ()=>{document.getElementById('peerStatus').textContent='disconnected'; document.getElementById('onlineDot').style.background='var(--danger)';});
  if(conn.open){ show('screen-chat'); conn.send({type:'hello', name:myName}); }
}

function handleData(d){
  if(d.type==='hello'){
    document.getElementById('peerNameLabel').textContent=d.name;
    document.getElementById('peerAvatar').textContent=initials(d.name);
    document.getElementById('peerStatus').textContent='online';
  } else if(d.type==='msg'){
    removeTyping(); addBubble('them', d.text, d.ts);
  } else if(d.type==='file'){
    removeTyping();
    const blob=new Blob([d.buffer], {type:d.mime});
    addFileBubble('them', blob, d.mime, d.ts);
  } else if(d.type==='typing'){
    showTyping();
  }
}

function addBubble(who, text, ts){
  const row=document.createElement('div'); row.className='bubble-row '+who;
  const b=document.createElement('div'); b.className='bubble';
  b.innerHTML=`<div>${escapeHtml(text)}</div><div class="bubble-time">${fmtTime(ts)}</div>`;
  row.appendChild(b); document.getElementById('messages').appendChild(row); scrollBottom();
}
function addFileBubble(who, blob, mime, ts){
  const url=URL.createObjectURL(blob);
  const row=document.createElement('div'); row.className='bubble-row '+who;
  const b=document.createElement('div'); b.className='bubble';
  const media = mime.startsWith('video') ? `<video src="${url}" controls></video>` : `<img src="${url}">`;
  b.innerHTML=media+`<div class="bubble-time">${fmtTime(ts)}</div>`;
  row.appendChild(b); document.getElementById('messages').appendChild(row); scrollBottom();
}
function escapeHtml(s){const d=document.createElement('div'); d.textContent=s; return d.innerHTML;}
function fmtTime(ts){const d=new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function scrollBottom(){const m=document.getElementById('messages'); m.scrollTop=m.scrollHeight;}

function sendText(){
  const inp=document.getElementById('msgInput'); const text=inp.value.trim();
  if(!text || !conn || !conn.open) return;
  const ts=Date.now();
  conn.send({type:'msg', text, ts});
  addBubble('me', text, ts);
  inp.value=''; inp.style.height='auto';
}
function onKeyDown(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendText(); } }
function onTyping(){
  const inp=document.getElementById('msgInput');
  inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,100)+'px';
  if(conn && conn.open) conn.send({type:'typing'});
}
let typingRow=null;
function showTyping(){
  removeTyping();
  const row=document.createElement('div'); row.className='bubble-row them typing-row'; row.id='typingRow';
  row.innerHTML=`<div class="bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  document.getElementById('messages').appendChild(row); scrollBottom();
  clearTimeout(typingTimeout); typingTimeout=setTimeout(removeTyping, 2000);
}
function removeTyping(){const r=document.getElementById('typingRow'); if(r) r.remove();}

function handleFile(e){
  const file=e.target.files[0]; if(!file || !conn || !conn.open) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const ts=Date.now();
    conn.send({type:'file', mime:file.type, buffer:reader.result, ts});
    addFileBubble('me', file, file.type, ts);
  };
  reader.readAsArrayBuffer(file);
  e.target.value='';
}

function startVideoCall(){
  if(!conn || !conn.open){toast('Not connected yet'); return;}
  navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(stream=>{
    localStream=stream;
    document.getElementById('localVideoFull').srcObject=stream;
    document.getElementById('videoFull').classList.remove('hidden');
    const call=peer.call(conn.peer, stream);
    bindCall(call);
  }).catch(()=>toast('Camera/mic permission needed'));
}
function bindCall(call){
  currentCall=call;
  document.getElementById('videoFull').classList.remove('hidden');
  call.on('stream', remoteStream=>{
    document.getElementById('remoteVideo').srcObject=remoteStream;
    document.getElementById('videoPip').classList.remove('hidden');
  });
  call.on('close', endVideoCall);
}
function endVideoCall(){
  if(currentCall) currentCall.close();
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  document.getElementById('videoFull').classList.add('hidden');
  document.getElementById('videoPip').classList.add('hidden');
  localStream=null;
}
function toggleMic(){
  if(!localStream) return;
  const track=localStream.getAudioTracks()[0];
  track.enabled=!track.enabled;
  toast(track.enabled?'Mic on':'Mic muted');
}
</script>
</body>
</html>
